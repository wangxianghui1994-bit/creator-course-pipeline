name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install pinned Agent Skills validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate Skill structure
        run: |
          python scripts/validate_skill_layout.py
          skills-ref validate skills/course-production-pipeline
          skills-ref validate skills/multi-platform-publish
      - name: Scan public tree
        run: python scripts/scan_public_tree.py
      - name: Run tests
        run: python -X utf8 -m pytest -q
